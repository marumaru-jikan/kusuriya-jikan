/* Layout: one calm phone-width column under an indigo dusk, views swapped in place, a fixed bottom tab bar (海月時間シリーズと同じ骨組み) */
:root{
  --bg:#EDF1F8; --bg-top:#D3DDEE; --surface:#FFFFFF; --sunk:#E1E7F2; --ink:#111D35; --muted:#4D5B76; --line:#C6D0E2;
  --teal:#24427F; --teal-soft:#DCE3F2; --accent:#B98C3A; --accent-soft:#F4EAD5; --accent-ink:#4A3410;
  --good:#23845A; --good-bg:#DCF1E6; --bad:#B9503A; --bad-bg:#F8E1DA;
  --night1:#2A4C8C; --night2:#17295A; --night3:#0A1530; --star:#E8D49A; --night-ink:#E6ECF8; --night-muted:#A9B7D3;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mincho:"Shippori Mincho","Hiragino Mincho ProN",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090F1C; --bg-top:#111B33; --surface:#0F182B; --sunk:#0C1424; --ink:#E3E9F6; --muted:#9AA8C4; --line:#22304C;
  --teal:#9DB6E6; --teal-soft:#18264A; --accent:#D9AE6C; --accent-soft:#3A2B14; --accent-ink:#F4DDB5;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090F1C; --bg-top:#111B33; --surface:#0F182B; --sunk:#0C1424; --ink:#E3E9F6; --muted:#9AA8C4; --line:#22304C;
  --teal:#9DB6E6; --teal-soft:#18264A; --accent:#D9AE6C; --accent-soft:#3A2B14; --accent-ink:#F4DDB5;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 360px) no-repeat;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:1rem;color:var(--teal);font-weight:700;white-space:nowrap;flex:none}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hello{padding-block:10px 4px}
.hello .eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--teal);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}

.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,var(--night1),var(--night2));color:var(--night-ink);border:0;border-radius:14px;padding:16px 18px}
.continue small{display:block;opacity:.85;font-size:.8rem}
.continue strong{font-family:var(--f-display);font-size:1.1rem}
.continue .go{font-size:1.4rem;color:var(--star)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subjects .subj:last-child:nth-child(odd){grid-column:1/-1}
.subj{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:92px}
.subj .k{font-family:var(--f-mincho);font-size:1.6rem;font-weight:700;line-height:1;color:var(--teal)}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj .small{line-height:1.45}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[disabled]{opacity:.5;cursor:default}
.item .body{flex:1;min-width:0}
.item .chev{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.mid{background:var(--accent-soft);color:var(--accent-ink)}
.lid{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.9rem}
.lid.done{background:var(--teal);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--teal);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#2B1F00}
.btn.wide{width:100%}
.btn.again{background:var(--teal-soft);color:var(--teal);border:2px solid var(--teal)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.subj:focus-visible,.choice:focus-visible,.card:focus-visible,.tab:focus-visible,.rflip:focus-visible,.continue:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* lesson */
.lesson section{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.75}
.fx{background:var(--sunk);border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-weight:700;line-height:1.8}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain span{background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.92rem}
.chain span.hl{background:var(--teal);color:var(--surface)}
.chain i{font-style:normal;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.scroll{overflow-x:auto}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.9rem}

/* cards */
.card{position:relative;width:100%;min-height:230px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.card .side{font-size:.75rem;letter-spacing:.1em;color:var(--teal);font-weight:700}
.card .term{font-family:var(--f-display);font-size:1.7rem;font-weight:900}
.card .def{font-size:1.02rem;line-height:1.8;max-width:30em}
.card.flipped{background:var(--teal-soft)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.qbox .prompt{color:var(--muted);font-size:.92rem}
.qbox .expr{font-family:var(--f-display);font-size:1.6rem;font-weight:900;margin-top:6px;overflow-wrap:anywhere;line-height:1.5}
.qbox .expr.long{font-size:1.12rem;font-weight:700;line-height:1.7;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{font-size:1.02rem;padding:12px;text-align:left}
.choice.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)}
.feedback.ng{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.feedback.ok .verdict{color:var(--good)} .feedback.ng .verdict{color:var(--bad)}
.hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--f-display);font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);line-height:1.1}

/* record */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:var(--teal);color:var(--surface);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab.on{color:var(--teal)}

@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}

/* 藍色の夕空 hero */
.sky{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(175deg,var(--night1) 0%,var(--night2) 55%,var(--night3) 100%);color:var(--night-ink);padding:22px 18px 20px;min-height:176px;display:flex;align-items:flex-end}
.sky .art{position:absolute;inset:0;width:100%;height:100%}
.sky .txt{position:relative;z-index:1;max-width:64%;display:flex;flex-direction:column;gap:4px}
.sky .name{font-family:var(--f-mincho);font-weight:700;font-size:1.05rem;letter-spacing:.24em;color:var(--star)}
.sky h1{color:#F3F6FC;font-size:1.45rem}
.sky p{color:var(--night-muted);font-size:.88rem}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.tw{animation:tw 3.2s ease-in-out infinite}

/* 薬草図鑑カード */
.rcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.rlead{font-family:var(--f-display);font-weight:700;color:var(--teal);text-align:center}
.rflip{border:0;padding:0;background:none;width:min(100%,300px);max-width:100%;aspect-ratio:3/4;perspective:1200px;cursor:pointer}
.rflip[disabled]{cursor:default}
.rinner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.rcard.open .rinner{transform:rotateY(180deg)}
.rback,.rfront{position:absolute;inset:0;border-radius:18px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 12px 30px rgba(6,14,34,.35)}
.rback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 80% at 50% 0%,#33599E 0%,#17295A 55%,#0A1530 100%);border:3px solid #D9B26A;color:#F2E7C6}
.rback svg{width:56%;height:auto}
.rhint{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:.95rem;padding:6px 14px;border-radius:99px;background:rgba(217,178,106,.18)}
.rcard:not(.open) .rflip{animation:nudge 2.6s ease-in-out 1s infinite}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}}
.rfront{transform:rotateY(180deg);background:#F6F0E1;border:3px solid #24427F}
.face{position:relative;display:block;width:100%;height:100%}
.face img{display:block;width:100%;height:100%;object-fit:cover}
.face .ph{display:none;width:100%;height:100%}
.face .ph svg{display:block;width:100%;height:100%}
.face.miss img{display:none}
.face.miss .ph{display:block}
.rcap,.viewer figcaption{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rcap{transition:opacity .4s ease .55s}
.rcard:not(.open) .rcap{opacity:0;visibility:hidden}
.rno{font-size:.8rem;letter-spacing:.06em;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.rno em{font-style:normal;background:var(--accent);color:#2B1F00;border-radius:99px;padding:0 9px;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.rname{font-family:var(--f-mincho);font-size:1.4rem;font-weight:700}
.rnote{font-size:.9rem;color:var(--muted)}
.rcount{font-size:.76rem;color:var(--muted);margin-top:4px}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.coll>*{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;border:0;padding:0}
.coll button{cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(5,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));color:#E6ECF8}
.viewer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}
.viewer .face{width:min(100%,46vh);height:auto;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#F6F0E1}
.viewer .rno,.viewer .rnote{color:#A9B7D3}
.viewer dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:4px 0 0;font-size:.88rem;text-align:left}
.viewer dt{color:#E8D49A;font-weight:700}.viewer dd{margin:0}

/* 薬草畑 */
.skybox{border-radius:22px;overflow:hidden;background:linear-gradient(175deg,#2A4C8C 0%,#17295A 58%,#0A1530 100%);color:#E6ECF8}
.skybox .field{display:block;width:100%;height:auto}
.skycount{display:flex;justify-content:space-between;padding:8px 16px 12px;font-size:.82rem;color:#B5C2DA}
.skycount b{color:#fff;font-size:1rem}
.stg{width:150px;max-width:42%;height:auto;flex:none;background:linear-gradient(175deg,#2A4C8C,#17295A);border-radius:16px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.stg .bob{animation:breathe 4s ease-in-out infinite;transform-origin:110px 130px}
.growtop{display:flex;gap:12px;align-items:center;justify-content:space-between}
.growtop>div{min-width:0}
.grow{display:flex;flex-direction:column;gap:10px}
.seed{width:20px;height:20px;flex:none}
.shardbal{display:flex;align-items:center;gap:6px;font-weight:700}
.shardbal b{font-size:1.15rem;color:var(--teal)}
.skymsg{margin:0;color:var(--teal);font-weight:700}
.born{display:flex;gap:12px;align-items:center;background:linear-gradient(175deg,#2A4C8C,#17295A);color:#E6ECF8;border:0}
.born h3{color:#fff;margin:2px 0;font-family:var(--f-mincho)}.born .muted{color:#B5C2DA}
.bsv{width:104px;height:104px;flex:none}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.zk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;background:linear-gradient(175deg,#2A4C8C,#17295A);color:#E6ECF8;min-width:0}
.zk svg{width:56px;height:56px}.zk b{font-size:.8rem;font-family:var(--f-mincho)}.zk span{font-size:.66rem;line-height:1.4;color:#B5C2DA}
.zk.no{background:var(--sunk);color:var(--muted)}
.shardget{display:flex;align-items:center;gap:10px}.shardget>div{flex:1;min-width:0}.shardget .seed{width:28px;height:28px}

/* PDF */
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rung .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{flex:none;width:46px;height:46px;fill:var(--accent-soft);stroke:var(--teal);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sname{font-family:var(--f-display);font-size:1.1rem}
.pdfbar{display:flex;gap:8px;align-items:center}
.pdfseg{display:flex;flex:1;background:var(--surface);border-radius:999px;padding:3px;border:1px solid var(--line)}
.pdfseg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:999px;font-size:.9rem}
.pdfseg button.on{background:var(--teal);color:var(--surface);font-weight:700}
.pdfzoom{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.85rem;white-space:nowrap}
.pdfpages{display:flex;flex-direction:column;gap:12px;overflow-x:auto;min-height:200px}
.pdfpage{background:#fff;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15);flex:none}
.pdfbtn{padding:9px 14px;font-size:.9rem}

/* 項目クリア：巻物がひらいて、メッセージ */
.maki{position:fixed;inset:0;z-index:30;background:rgba(6,12,28,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;border:0;width:100%;cursor:pointer;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}}
.mk{display:flex;flex-direction:row-reverse;align-items:stretch;height:min(380px,60vh);filter:drop-shadow(0 14px 24px rgba(0,0,0,.35))}
.rod{width:14px;flex:none;border-radius:7px;background:linear-gradient(90deg,#6E5020,#B98C3A,#E6C67E,#B98C3A,#6E5020);position:relative}
.rod::before,.rod::after{content:"";position:absolute;left:-4px;width:22px;height:12px;border-radius:5px;background:#4E3814}
.rod::before{top:-7px}.rod::after{bottom:-7px}
.sheet{width:0;overflow:hidden;background:#F6F0E1;background-image:linear-gradient(90deg,rgba(36,66,127,.06) 1px,transparent 1px);background-size:36px 100%;border-block:7px solid #24427F;transition:width 1.8s cubic-bezier(.4,.1,.2,1) .2s}
.maki.open .sheet{width:min(290px,68vw)}
.sheet .tx{writing-mode:vertical-rl;width:min(290px,68vw);height:100%;padding:22px 18px;font-family:var(--f-mincho);color:#16233F;font-size:1.05rem;line-height:2.15;letter-spacing:.1em;text-align:left}

const HERBS = HERB_ROWS.map(([no,name,sho,part,use,f,c,memo])=>({ key:'y'+String(no).padStart(2,'0'), no, name, sho, part, use, f, c, memo, src:'zukan/y'+String(no).padStart(2,'0')+'.jpg' }));
function herbG(sp,x,y,k){
  x=+x; y=+y; const h=26*k, t=y-h, c=sp.c, lf='#5E9A5A', lf2='#7AB26C';
  let s=`<path d="M${x} ${y} Q${x+2*k} ${y-h/2} ${x} ${t+2*k}" stroke="${lf}" stroke-width="${1.8*k}" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${x} ${y-7*k} q${-9*k} ${-1*k} ${-11*k} ${-8*k} q${8*k} 0 ${11*k} ${7*k}Z" fill="${lf2}"/><path d="M${x} ${y-13*k} q${9*k} ${-1*k} ${11*k} ${-8*k} q${-8*k} 0 ${-11*k} ${7*k}Z" fill="${lf}"/>`;
  const pet=(n,r,rx,ry,col)=>{ let o=''; for(let i=0;i<n;i++){ const a=i*360/n, px=x+r*Math.sin(a*Math.PI/180), py=t-r*Math.cos(a*Math.PI/180); o+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${rx}" ry="${ry}" transform="rotate(${a.toFixed(0)} ${px.toFixed(1)} ${py.toFixed(1)})" fill="${col}" stroke="rgba(0,0,0,.12)" stroke-width="${.4*k}"/>`; } return o; };
  if(sp.f==='five') s+=pet(5,4.6*k,3*k,4.6*k,c)+`<circle cx="${x}" cy="${t}" r="${1.8*k}" fill="#F2D36B"/>`;
  else if(sp.f==='four') s+=pet(4,4.8*k,3.2*k,4.8*k,c)+`<rect x="${x-1.2*k}" y="${t-6*k}" width="${2.4*k}" height="${7*k}" rx="${1.2*k}" fill="#E9D46A"/>`;
  else if(sp.f==='daisy') s+=pet(12,5*k,1.3*k,4.2*k,c)+`<circle cx="${x}" cy="${t}" r="${2.8*k}" fill="#F2C94C"/>`;
  else if(sp.f==='umbel'){ for(let i=0;i<7;i++){ const a=(-60+i*20)*Math.PI/180, px=x+9*k*Math.sin(a), py=t-9*k*Math.cos(a)+4*k; s+=`<path d="M${x} ${t+4*k} L${px.toFixed(1)} ${py.toFixed(1)}" stroke="${lf}" stroke-width="${.8*k}"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${2*k}" fill="${c}" stroke="rgba(0,0,0,.12)" stroke-width="${.3*k}"/>`; } }
  else if(sp.f==='berry'){ [[0,0],[-3.4,2.6],[3.4,2.6],[-1.8,5.6],[1.8,5.6],[0,-3.4]].forEach(([dx,dy])=>{ s+=`<circle cx="${x+dx*k}" cy="${t+dy*k}" r="${2*k}" fill="${c}"/><circle cx="${x+dx*k-.6*k}" cy="${t+dy*k-.6*k}" r="${.5*k}" fill="#fff" opacity=".6"/>`; }); }
  else { for(let i=0;i<7;i++){ const py=t+4*k-i*2.6*k, r=(2.2-i*.18)*k; s+=`<circle cx="${x-r*.7}" cy="${py}" r="${r}" fill="${c}"/><circle cx="${x+r*.7}" cy="${py}" r="${r}" fill="${c}"/>`; } }
  return s;
}

function drawReward(){
  const has=new Set(R.cards), unseen=HERBS.map((_,i)=>i).filter(i=>!has.has(HERBS[i].key));
  const i = unseen.length ? pick(unseen) : ri(0,HERBS.length-1), isNew=!has.has(HERBS[i].key);

function rewardCard(rw){ const h=HERBS[rw.i];

/* ===== 薬草を育てる（種をまいて、薬草を咲かせる） ===== */
const SKY_NEED = 30;
const GROW = [ {n:'種', at:0, d:'畑に、小さな種をまきました。'}, {n:'芽', at:8, d:'土から、小さな芽が出てきました。'}, {n:'若葉', at:15, d:'葉が広がって、すくすく育っています。'}, {n:'つぼみ', at:23, d:'つぼみがふくらんできました。もうすぐです。'} ];
const spOf = key => HERBS.find(x=>x.key===key) || HERBS[0];
function skyInit(){
  if(!R.sky){ const n=Object.keys(R.lessons||{}).length; R.sky={ shards:n, total:n, fed:0, sp:null, born:[] }; }
  if(!R.sky.sp) R.sky.sp=skyNextSp(); return R.sky;
}
function skyNextSp(){ const got=new Set((R.sky&&R.sky.born||[]).map(t=>t.sp)); const rest=HERBS.filter(x=>!got.has(x.key)); return pick(rest.length?rest:HERBS).key; }
const growOf = fed => { let g=GROW[0]; for(const s of GROW) if(fed>=s.at) g=s; return g; };
const SEED_I = `<svg class="seed" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="6" ry="8" fill="#B98C3A" stroke="#6E5020" stroke-width="1"/><path d="M12 6 Q14 12 12 20" stroke="#6E5020" stroke-width="1" fill="none" opacity=".6"/></svg>`;
function stageSVG(fed){
  const g=growOf(fed).n, x=110, y=132; let s='';
  const soil=`<path d="M0 132 Q60 124 110 130 T220 128 V170 H0Z" fill="#3A2C1E"/><path d="M0 146 Q80 138 150 146 T220 144 V170 H0Z" fill="#2A1F15"/>`;
  if(g==='種') s=`<ellipse cx="${x}" cy="128" rx="7" ry="5" fill="#B98C3A" stroke="#6E5020"/><path d="M${x-3} 125 q3 -3 6 0" stroke="#6E5020" fill="none"/>`;
  else if(g==='芽') s=`<path d="M${x} 132 Q${x+1} 120 ${x} 110" stroke="#7AB26C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${x} 112 q-10 -2 -12 -10 q9 0 12 9Z" fill="#8CC47A"/><path d="M${x} 112 q10 -2 12 -10 q-9 0 -12 9Z" fill="#7AB26C"/>`;
  else if(g==='若葉') s=herbG({f:'none',c:'#7AB26C'},x,y,2).replace(/<circle[^>]*>/g,'');
  else s=herbG({f:'berry',c:'#9DB6E6'},x,y,2.2);
  return `<svg class="stg" viewBox="0 0 220 170" role="img" aria-label="${g}">${soil}<g class="bob">${s}</g></svg>`;
}
function fieldSVG(born){
  const n=born.length, rnd=seeded(11); let bg='';
  for(let i=0;i<26;i++) bg+=`<circle class="${i%3===0?'tw':''}" cx="${(rnd()*360).toFixed(1)}" cy="${(rnd()*120).toFixed(1)}" r="${(.6+rnd()*1.2).toFixed(2)}" fill="#F3E7C2" opacity="${(.25+rnd()*.5).toFixed(2)}"/>`;
  bg+=`<path d="M292 30 a16 16 0 1 0 12 26 a12 12 0 1 1 -12 -26Z" fill="#F3E7C2" opacity=".9"/>`;
  const show=born.slice(-30), k=n>16?.75:n>8?.9:1.05; let st='';
  show.forEach((t,i)=>{ const r=seeded(i*31+7), x=22+r()*316, y=184+r()*34; st+=herbG(spOf(t.sp),x.toFixed(1),y.toFixed(1),k); });
  return `<svg class="field" viewBox="0 0 360 230" role="img" aria-label="薬草畑　薬草 ${n} 本">${bg}<path d="M0 150 Q90 130 180 142 T360 136 V230 H0Z" fill="#14244A" opacity=".8"/><path d="M0 178 Q70 168 140 176 T280 172 T360 176 V230 H0Z" fill="#3A2C1E"/><path d="M0 200 H360 M0 214 H360" stroke="#2A1F15" stroke-width="2"/>${st}${n?'':`<text x="180" y="104" text-anchor="middle" fill="#B5C2DA" font-size="13">まだ咲いた薬草はありません</text>`}</svg>`;
}
function skyFeed(arg){
  const s=skyInit(), before=growOf(s.fed).n, n=Math.min(arg==='all'?s.shards:1, s.shards, SKY_NEED-s.fed); if(n<=0) return;
  s.shards-=n; s.fed+=n; S.born=null; S.skyMsg='';
  if(s.fed>=SKY_NEED){ s.born.push({ sp:s.sp, d:today() }); S.born=s.sp; s.fed=0; s.sp=skyNextSp(); }
  else if(growOf(s.fed).n!==before) S.skyMsg=`${growOf(s.fed).n}に育ちました！`;
  else S.skyMsg=`種を ${n} つまきました。`;
  save();
}

  <div class="panel"><div class="kv"><span>解いた問題</span><b class="num">${R.answered}問</b></div><div class="kv"><span>正答率</span><b class="num">${acc}%</b></div><div class="kv"><span>連続した日</span><b class="num">${streak()}日</b></div></div>
  ${coll}${viewer}
  ${units.length?units.map(([uid,u])=>`<div class="panel"><h3 style="margin-bottom:6px">${u.subject}　${u.no}　${u.title}</h3>${u.lessons.map(l=>`<div class="kv"><span>${l.id}　${l.t}</span>${lTag(uid,l.id)}</div>`).join('')}</div>`).join(''):'<p class="small muted">種（5分の学習）を終えると、ここに記録が並びます。</p>'}</div>`;
}
function vSky(){
  const s=skyInit(), g=growOf(s.fed), got=new Set(s.born.map(t=>t.sp)), b=S.born?spOf(S.born):null, nextG=GROW.find(x=>x.at>s.fed);
  return `<div class="stack"><div class="hello"><div class="eyebrow">畑</div><h1>種をまいて薬草を育てよう</h1></div>
  <div class="skybox">${fieldSVG(s.born)}<div class="skycount"><span>畑の薬草 <b class="num">${s.born.length}</b> 本</span><span>薬草帳 <b class="num">${got.size}</b> / ${HERBS.length}</span></div></div>
  ${b?`<div class="panel born pop"><svg viewBox="0 0 120 120" class="bsv">${herbG(b,60,108,2.8)}</svg><div><p class="small muted">薬草が咲きました！</p><h3>${b.name}</h3><p class="small">生薬名 ${b.sho}・${b.part}。${b.use}。</p></div></div>`:''}
  <div class="panel grow"><div class="growtop"><div><p class="small muted">いま育てている薬草</p><h3>${g.n}</h3><p class="small">${g.d}</p></div>${stageSVG(s.fed)}</div>
    <div class="meter"><i style="width:${s.fed/SKY_NEED*100}%"></i></div>
    <p class="small muted">${nextG?`あと <b class="num">${nextG.at-s.fed}</b> 粒で${nextG.n}、`:''}あと <b class="num">${SKY_NEED-s.fed}</b> 粒で薬草が咲きます。どの薬草になるかは、お楽しみ。</p>
    <div class="shardbal">${SEED_I}<span>もっている種 <b class="num">${s.shards}</b></span></div>
    ${S.skyMsg?`<p class="skymsg pop">${S.skyMsg}</p>`:''}
    <div class="two"><button class="btn" data-act="feed" data-arg="1" ${s.shards?'':'disabled'}>1粒まく</button><button class="btn ghost" data-act="feed" data-arg="all" ${s.shards?'':'disabled'}>まとめてまく</button></div>
    ${s.shards?'':'<p class="small muted">まだクリアしていない種（5分の学習）を1つクリアすると、種がひとつぶ手に入ります。</p>'}</div>
  <div class="panel"><h3>薬草帳</h3><div class="zukan" style="margin-top:10px">${HERBS.map(sp=>got.has(sp.key)?`<div class="zk"><svg viewBox="0 0 60 60">${herbG(sp,30,56,1.5)}</svg><b>${sp.name}</b><span>${sp.sho}・${sp.part}</span></div>`:`<div class="zk no"><svg viewBox="0 0 60 60"><path d="M30 56 V26 M30 44 q-10 0 -12 -9 q9 0 12 9Z M30 38 q10 0 12 -9 q-9 0 -12 9Z" fill="currentColor" stroke="currentColor" opacity=".2"/><circle cx="30" cy="22" r="6" fill="currentColor" opacity=".2"/></svg><b>？？？</b></div>`).join('')}</div></div></div>`;
}
function vSettings(){
  return `<div class="stack"><div class="hello"><div class="eyebrow">設定</div><h1>呼び名</h1></div>
  <div class="panel stack"><label for="st-name"><b>呼び名</b></label><input type="text" id="st-name" value="${esc(R.name)}" maxlength="12" autocomplete="off"></div></div>`;
}
function vInstall(){
  return `${top('ホーム画面に追加')}<div class="stack">
  <div class="panel stack"><h3>iPhone・iPad（Safari）</h3><ol class="steps"><li>下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」を選ぶ</li><li>右上の「追加」をタップ</li></ol></div>
  <div class="panel stack"><h3>Android（Chrome）</h3><ol class="steps"><li>右上の「︙」メニューをタップ</li><li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li></ol></div></div>`;
}

/* ===== 演習問題（PDF） ===== */
const STAGES = [
  { lv:1, name:'種', desc:'基礎問題', icon:'<ellipse cx="24" cy="28" rx="7" ry="9"/><path d="M24 20 Q27 28 24 37"/>' },
  { lv:2, name:'芽', desc:'標準問題', icon:'<path d="M24 42 V24"/><path d="M24 28 q-10 0 -12 -10 q10 0 12 10Z"/><path d="M24 26 q10 0 12 -10 q-10 0 -12 10Z"/>' },
  { lv:3, name:'若葉', desc:'確認テスト', icon:'<path d="M24 44 V14"/><path d="M24 36 q-12 0 -14 -10 q12 0 14 10Z"/><path d="M24 30 q12 0 14 -10 q-12 0 -14 10Z"/><path d="M24 22 q-8 0 -10 -8 q8 0 10 8Z"/>' },
  { lv:4, name:'つぼみ', desc:'本試験レベル', icon:'<path d="M24 44 V20"/><path d="M24 34 q-10 0 -12 -9 q10 0 12 9Z"/><path d="M24 20 C18 16 20 6 24 4 C28 6 30 16 24 20Z"/>' },
  { lv:5, name:'花', desc:'本試験・応用', icon:'<path d="M24 44 V24"/><circle cx="24" cy="16" r="3"/><circle cx="24" cy="8" r="4"/><circle cx="32" cy="14" r="4"/><circle cx="29" cy="23" r="4"/><circle cx="19" cy="23" r="4"/><circle cx="16" cy="14" r="4"/>' },
];
function vDrill(){
  const u=CU();
  return `${top(u.no+'　'+u.title+'　演習問題')}<div class="stack"><p class="small muted">この単元の演習問題（PDF）です。印刷しても、画面で解いても大丈夫です。薬草が育つのと同じように、Lv1から順にレベルが上がります。</p>
  <div class="ladder">${STAGES.map(s=>{ const p=PDF[u.drill+'-lv'+s.lv]||{};
    return `<div class="rung"><svg class="stage" viewBox="0 0 48 48" aria-hidden="true">${s.icon}</svg><div class="body"><div class="row" style="gap:8px"><span class="tag">Lv${s.lv}</span><b class="sname">${s.name}</b></div><p class="small">${s.desc}</p>
    ${p.q?`<div class="row"><button class="btn pdfbtn" data-act="pdf" data-arg="${s.lv}|0">問題を開く</button><button class="btn ghost pdfbtn" data-act="pdf" data-arg="${s.lv}|1">解答・解説</button></div>`:'<span class="small muted">準備中</span>'}</div></div>`; }).join('')}</div></div>`;
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLibP=null;
const loadScript = src => new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); });
function pdfLib(){ if(!pdfLibP) pdfLibP=loadScript(PDFJS+'pdf.min.js').then(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; return pdfjsLib; }).catch(e=>{ pdfLibP=null; throw e; }); return pdfLibP; }
function openPdf(arg){ const [lv,i]=arg.split('|'), u=CU(), st=STAGES.find(s=>s.lv===+lv), p=PDF[u.drill+'-lv'+lv]||{};
  S.pdf={ title:`Lv${lv} ${st.name}`, list:[{label:'問題',url:p.q},{label:'解答・解説',url:p.a}], i:+i, z:1, tok:0 }; go('pdf'); }
function vPdf(){ const P=S.pdf;
  return `${top(CU().title+'　'+P.title)}<div class="stack"><div class="pdfbar"><div class="pdfseg">${P.list.map((x,i)=>`<button class="${i===P.i?'on':''}" data-act="pdfTab" data-arg="${i}">${x.label}</button>`).join('')}</div>
  <button class="pdfzoom" data-act="pdfZoom">${P.z>1?'－ 縮小':'＋ 拡大'}</button></div><div id="pdfpages" class="pdfpages"><p class="small muted" style="padding:24px;text-align:center">読みこみ中…</p></div>
  <a class="btn ghost wide pdfbtn" style="text-align:center;text-decoration:none" href="${esc(P.list[P.i].url||'')}" target="_blank" rel="noopener">PDFを別の画面で開く（印刷用）</a></div>`; }
async function renderPdf(){ const P=S.pdf, box=document.getElementById('pdfpages'); if(!box) return; const tok=++P.tok;
  try{ const lib=await pdfLib(), r=await fetch(P.list[P.i].url); if(!r.ok) throw 0; const data=await r.arrayBuffer(); if(tok!==P.tok) return;
    const doc=await lib.getDocument({ data, isEvalSupported:false }).promise; if(tok!==P.tok) return; box.innerHTML='';
    const W=Math.floor(box.clientWidth*P.z), dpr=Math.min(Math.max(window.devicePixelRatio||1,2)*1.5,4);
    for(let n=1;n<=doc.numPages;n++){ const pg=await doc.getPage(n); if(tok!==P.tok) return; const v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:W/v0.width*dpr}), cv=document.createElement('canvas');
      cv.width=vp.width; cv.height=vp.height; cv.className='pdfpage'; cv.style.width=W+'px'; box.appendChild(cv); await pg.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise; } }
  catch(e){ if(tok===P.tok) box.innerHTML='<p class="small muted" style="padding:24px;text-align:center">PDFを読みこめませんでした。下のボタンから開いてください。</p>'; } }

const VIEWS={ setup:vSetup, home:vHome, course:vCourse, subject:vSubject, unit:vUnit, lesson:vLesson, cards:vCards, quiz:vQuiz, result:vResult, record:vRecord, settings:vSettings, install:vInstall, drill:vDrill, pdf:vPdf, sky:vSky };
function render(){
  if(S.view!=='result') clearMaki();
  app.innerHTML=VIEWS[S.view]();
  tabs.hidden = S.view==='setup';
  const tabFor={record:'record',settings:'settings',sky:'sky'}[S.view]||'home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabFor));
  const n=document.getElementById('st-name');
  if(n) n.addEventListener('input',e=>{ R.name=e.target.value.trim(); save(); });
  if (S.view==='pdf') renderPdf();
}
function answerQ(picked){
  const Q=S.quiz, q=Q.qs[Q.i], ok=picked===q.answer; Q.picked=picked; R.answered++;
  if(ok){ Q.score++; R.correct++; } else Q.wrong.push(q);
  markDay(); save(); render();
}

document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ S.stack=[]; S.viewCard=null; S.born=null; S.skyMsg=''; S.view=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, arg=b.dataset.arg;
  if(a==='back') back();
  else if(a==='makiClose'){ b.classList.add('bye'); setTimeout(clearMaki,400); }
  else if(a==='openReward'){ const rc=b.closest('.rcard'); if(rc) rc.classList.add('open'); b.disabled=true; }
  else if(a==='viewCard'){ S.viewCard=+arg; render(); }
  else if(a==='closeCard'){ S.viewCard=null; render(); }
  else if(a==='go') go(arg);
  else if(a==='pdf') openPdf(arg);
  else if(a==='pdfTab'){ S.pdf.i=+arg; render(); }
  else if(a==='pdfZoom'){ S.pdf.z=S.pdf.z>1?1:1.8; render(); }
  else if(a==='course'){ S.course=arg; go('course'); }
  else if(a==='subject'){ S.subj=+arg; go('subject'); }
  else if(a==='unit'){ S.uid=arg; go('unit'); }
  else if(a==='setupDone'){ const nm=document.getElementById('su-name').value.trim(); if(!nm){ document.getElementById('su-err').hidden=false; return; }
    R.done=true; R.name=nm; save(); S.stack=[]; S.view='home'; render(); }
  else if(a==='lesson'){ if(b.dataset.uid) S.uid=b.dataset.uid; S.lid=arg; go('lesson'); }
  else if(a==='lessonNext'){ const u=CU(); S.lid=arg; S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject','unit']; S.view='lesson'; render(); window.scrollTo(0,0); }
  else if(a==='quiz') startQuiz();
  else if(a==='cards'){ S.deck={cur:deckNext()}; S.flipped=false; markDay(); go('cards'); }
  else if(a==='flip'){ S.flipped=!S.flipped; render(); }
  else if(a==='cardKnown'){ const k=knownList(); if(!k.includes(S.deck.cur)) k.push(S.deck.cur); save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='cardLater'){ const left=terms().map((_,i)=>i).filter(i=>!knownList().includes(i)); S.deck.cur=left[(left.indexOf(S.deck.cur)+1)%left.length]; S.flipped=false; render(); }
  else if(a==='cardsReset'){ R.known[S.uid]=[]; save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='hint'){ S.quiz.hint=true; render(); }
  else if(a==='pick') answerQ(arg);
  else if(a==='next'){ const Q=S.quiz;
    if(Q.i+1<Q.qs.length){ Q.i++; Q.picked=null; Q.hint=false; render(); window.scrollTo(0,0); return; }
    S.reward=null; S.gotShard=false; let makiNow=false;
    if(!Q.retry){ skyInit(); const u=CU(), l=LX(S.lid), k=lkey(S.uid,l.id), first=!R.lessons[k], wasDone=unitDone(S.uid), wasItem=itemDone(S.uid), n=Q.qs.length, s=R.lessons[k]||{best:0,tries:0,total:n};
      s.tries++; s.best=Math.max(s.best,Q.score); s.total=n; R.lessons[k]=s; R.lastUnit=S.uid; save();
      if(!wasDone&&unitDone(S.uid)){ S.reward=drawReward(); S.reward.title=u.title; }
      if(first){ R.sky.shards++; R.sky.total++; S.gotShard=true; save(); }
      makiNow = !wasItem && itemDone(S.uid); }
    S.view='result'; render(); window.scrollTo(0,0); if(makiNow) openMaki(itemName(S.uid)); }
  else if(a==='retry'){ const list=S.quiz.wrong.map(q=>Object.assign({},q,{choices:shuffle([...q.choices])})); S.view=S.stack.pop()||'lesson'; startQuiz(list); }
  else if(a==='again'){ S.view=S.stack.pop()||'lesson'; startQuiz(); }
  else if(a==='feed'){ skyFeed(arg); render(); }
  else if(a==='toSky'){ S.stack=[]; S.born=null; S.skyMsg=''; S.view='sky'; render(); window.scrollTo(0,0); }
  else if(a==='tounit'){ const u=CU(); S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject']; S.view='unit'; render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.viewCard!=null){ S.viewCard=null; render(); } });

render();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
